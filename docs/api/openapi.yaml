openapi: 3.1.0
info:
  title: NetLLM
  description: Local networking tutor API.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: 'Liveness only: the process is up. Dependencies are checked by
        /smoke.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /smoke:
    post:
      tags:
      - ops
      summary: Smoke
      description: 'End-to-end stack check: call a tool on mcp, write a trace event
        to postgres, query chroma.'
      operationId: smoke_smoke_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmokeResult'
  /sessions:
    post:
      tags:
      - sessions
      summary: Create Session
      description: Start a learner session. Its uploads are visible to this session
        only and expire with it.
      operationId: create_session_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateSessionRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}:
    delete:
      tags:
      - sessions
      summary: Delete Session
      description: End a session now and delete everything in it (uploads, vectors,
        rows). Idempotent.
      operationId: delete_session_sessions__session_id__delete
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/uploads:
    post:
      tags:
      - sessions
      summary: Upload
      description: Add a file to this session's knowledge base. The raw file is deleted
        once it is ingested.
      operationId: upload_sessions__session_id__uploads_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_sessions__session_id__uploads_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/retrieve:
    post:
      tags:
      - sessions
      summary: Retrieve
      description: Passages for a query from the admin KB plus this session's uploads,
        with provenance.
      operationId: retrieve_sessions__session_id__retrieve_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_sessions__session_id__uploads_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: PDF, Markdown or text
      type: object
      required:
      - file
      title: Body_upload_sessions__session_id__uploads_post
    CaptureInfo:
      properties:
        id:
          type: string
          title: Id
          description: Value to pass as `capture` to the other tools
        description:
          type: string
          title: Description
      type: object
      required:
      - id
      - description
      title: CaptureInfo
    CaptureList:
      properties:
        captures:
          items:
            $ref: '#/components/schemas/CaptureInfo'
          type: array
          title: Captures
      type: object
      required:
      - captures
      title: CaptureList
    ChromaCheck:
      properties:
        heartbeat:
          type: integer
          title: Heartbeat
          description: Chroma server heartbeat (nanosecond timestamp)
        top_id:
          type: string
          title: Top Id
          description: Id of the nearest vector to the smoke query; 'smoke' when the
            round-trip works
      type: object
      required:
      - heartbeat
      - top_id
      title: ChromaCheck
    CreateSessionRequest:
      properties:
        profile:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: 'null'
          title: Profile
          description: Learner profile (file name in configs/profiles/, without .yaml).
            Defaults to NETLLM_PROFILE.
      type: object
      title: CreateSessionRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthResponse
    Passage:
      properties:
        n:
          type: integer
          title: N
          description: Number used in the context block and in citations, e.g. [1]
        chunk_id:
          type: string
          title: Chunk Id
        scope:
          type: string
          enum:
          - admin
          - session
          title: Scope
        source:
          type: string
          title: Source
          description: File the chunk came from
        section:
          type: string
          title: Section
          description: Heading path, e.g. '3.5 TCP > 3.5.6 Flow Control'
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        source_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Sha256
          description: SHA-256 of the exact source file version
        upload_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Upload Id
          description: 'Session passages only: the upload it came from'
        label:
          type: string
          title: Label
          description: Human-readable citation
        distance:
          type: number
          title: Distance
          description: Cosine distance to the query; lower is closer
        text:
          type: string
          title: Text
      type: object
      required:
      - n
      - chunk_id
      - scope
      - source
      - section
      - page
      - source_sha256
      - upload_id
      - label
      - distance
      - text
      title: Passage
    RetrieveRequest:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
        k:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: K
          description: How many passages to return
          default: 5
      type: object
      required:
      - query
      title: RetrieveRequest
    RetrieveResponse:
      properties:
        context:
          type: string
          title: Context
          description: Passages as a quoted-data block, ready to put in a prompt (ADR
            0011)
        passages:
          items:
            $ref: '#/components/schemas/Passage'
          type: array
          title: Passages
      type: object
      required:
      - context
      - passages
      title: RetrieveResponse
    SessionResponse:
      properties:
        session_id:
          type: string
          format: uuid
          title: Session Id
          description: Random, pseudonymous session id
        profile:
          type: string
          title: Profile
        created_at:
          type: string
          format: date-time
          title: Created At
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: When the session and everything in it is deleted
      type: object
      required:
      - session_id
      - profile
      - created_at
      - expires_at
      title: SessionResponse
    SmokeResult:
      properties:
        mcp:
          anyOf:
          - $ref: '#/components/schemas/CaptureList'
          - type: 'null'
          description: Result of the list_captures tool called on the mcp service
        trace_event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trace Event Id
          description: Id of the row written to session.trace_events
        chroma:
          $ref: '#/components/schemas/ChromaCheck'
      type: object
      required:
      - mcp
      - trace_event_id
      - chroma
      title: SmokeResult
    UploadResponse:
      properties:
        upload_id:
          type: string
          format: uuid
          title: Upload Id
        filename:
          type: string
          title: Filename
          description: Sanitised file name; this is the `source` shown in citations
        sha256:
          type: string
          title: Sha256
          description: SHA-256 of the uploaded bytes
        size_bytes:
          type: integer
          title: Size Bytes
        n_chunks:
          type: integer
          title: N Chunks
          description: Chunks added to this session's knowledge base
      type: object
      required:
      - upload_id
      - filename
      - sha256
      - size_bytes
      - n_chunks
      title: UploadResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
