openapi: 3.1.0
info:
  title: NetLLM
  description: Local networking tutor API.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: 'Liveness only: the process is up. Dependencies are checked by
        /smoke.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /smoke:
    post:
      tags:
      - ops
      summary: Smoke
      description: 'End-to-end stack check: call a tool on mcp, write a trace event
        to postgres, query chroma.'
      operationId: smoke_smoke_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmokeResult'
components:
  schemas:
    ChromaCheck:
      properties:
        heartbeat:
          type: integer
          title: Heartbeat
          description: Chroma server heartbeat (nanosecond timestamp)
        top_id:
          type: string
          title: Top Id
          description: Id of the nearest vector to the smoke query; 'smoke' when the
            round-trip works
      type: object
      required:
      - heartbeat
      - top_id
      title: ChromaCheck
    Flow:
      properties:
        flow_id:
          type: integer
          title: Flow Id
          description: Stable within one capture, e.g. tcp.stream / udp.stream
        protocol:
          type: string
          title: Protocol
          description: 'Transport protocol: TCP, UDP, ...'
        src:
          type: string
          title: Src
        src_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Src Port
        dst:
          type: string
          title: Dst
        dst_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Dst Port
        packets:
          type: integer
          title: Packets
        bytes:
          type: integer
          title: Bytes
        first_packet:
          type: integer
          title: First Packet
        start_rel_ts:
          type: number
          title: Start Rel Ts
        duration:
          type: number
          title: Duration
      type: object
      required:
      - flow_id
      - protocol
      - src
      - dst
      - packets
      - bytes
      - first_packet
      - start_rel_ts
      - duration
      title: Flow
    FlowList:
      properties:
        flows:
          items:
            $ref: '#/components/schemas/Flow'
          type: array
          title: Flows
        total:
          type: integer
          title: Total
        truncated:
          type: boolean
          title: Truncated
      type: object
      required:
      - flows
      - total
      - truncated
      title: FlowList
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
      type: object
      title: HealthResponse
    SmokeResult:
      properties:
        mcp:
          anyOf:
          - $ref: '#/components/schemas/FlowList'
          - type: 'null'
          description: Result of the list_flows tool called on the mcp service
        trace_event_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Trace Event Id
          description: Id of the row written to session.trace_events
        chroma:
          $ref: '#/components/schemas/ChromaCheck'
      type: object
      required:
      - mcp
      - trace_event_id
      - chroma
      title: SmokeResult
