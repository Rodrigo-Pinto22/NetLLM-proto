[project]
name = "netllm-proto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.1",
    "fastmcp>=4.1.4",
    "matplotlib>=3.11.2",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.1",
    "pymupdf4llm>=1.28.2,<2",
    "pyshark>=0.6",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.2.0",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[project.scripts]
netllm-mcp = "netllm.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
